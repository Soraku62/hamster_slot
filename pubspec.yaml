name: hamster
description: "FEVER GACHA - a flashy pachislot-style gacha made with Flutter."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
    - assets/cards/
  fonts:
    - family: Dela
      fonts: [{asset: assets/fonts/DelaGothicOne-Regular.ttf}]
    - family: Boku
      fonts: [{asset: assets/fonts/YujiBoku-Regular.ttf}]
    - family: Reggae
      fonts: [{asset: assets/fonts/ReggaeOne-Regular.ttf}]
    - family: Rampart
      fonts: [{asset: assets/fonts/RampartOne-Regular.ttf}]
